[project]
name = "converter-marker"
version = "0.1.0"
description = "PCB panel DataMatrix printing machine controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt5>=5.15.0",
  "opencv-python>=4.10.0",
  "numpy>=1.26.0",
  "pyserial>=3.5",
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
